<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
{{base}}
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf3db" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#103c48" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
{{feeds}}
<script>
// Applies the theme picked with the switch in the header before the page is drawn.
try { const theme = localStorage.getItem('theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="{{root}}assets/css/style.css">
<script src="{{root}}assets/js/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
<div class="wrap">
<a class="brand" href="{{home}}"><span class="brand-mark" aria-hidden="true">{{initials}}</span><span>{{site_title}}</span></a>
<nav class="site-nav" aria-label="Main">
{{nav}}
</nav>
<button class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch between light and dark theme">
<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.6 4.6 6 6M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
</button>
</div>
</header>
<main id="main" class="wrap">
{{content}}
</main>
<footer class="site-footer">
<div class="wrap">
<p>© {{year}} {{author}} · Opinions are my own.</p>
<p>{{footer}}</p>
</div>
</footer>
</body>
</html>

<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
{{base}}
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
{{feeds}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="{{root}}assets/css/style.css">
<script src="{{root}}assets/js/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
<div class="wrap">
<a class="brand" href="{{home}}"><span class="brand-mark" aria-hidden="true">{{initials}}</span><span>{{site_title}}</span></a>
<nav class="site-nav" aria-label="Main">
{{nav}}
</nav>
</div>
</header>
<main id="main" class="wrap">
{{content}}
</main>
<footer class="site-footer">
<div class="wrap">
<p>© {{year}} {{author}} · Opinions are my own.</p>
<p>{{footer}}</p>
</div>
</footer>
</body>
</html>
